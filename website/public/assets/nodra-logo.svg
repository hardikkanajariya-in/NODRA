<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#0d111c" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Knowledge Node Network Lines (Letter N) -->
  <!-- Left Pillar -->
  <line x1="28" y1="74" x2="28" y2="26" stroke="url(#grad-blue)" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <!-- Diagonal -->
  <line x1="28" y1="26" x2="72" y2="74" stroke="url(#grad-cyan)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Right Pillar -->
  <line x1="72" y1="74" x2="72" y2="26" stroke="url(#grad-blue)" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  
  <!-- Secondary Knowledge Graph Edges -->
  <line x1="28" y1="50" x2="50" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="50" y1="50" x2="72" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="28" y1="74" x2="50" y2="50" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="50" x2="72" y2="26" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>

  <!-- Network Nodes -->
  <!-- Bottom Left -->
  <circle cx="28" cy="74" r="5.5" fill="#0d111c" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="28" cy="74" r="2.5" fill="#38bdf8"/>
  
  <!-- Mid Left -->
  <circle cx="28" cy="50" r="3.5" fill="#3b82f6"/>
  
  <!-- Top Left -->
  <circle cx="28" cy="26" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="28" cy="26" r="2.5" fill="#ffffff"/>

  <!-- Center Hub Node -->
  <circle cx="50" cy="50" r="4.5" fill="#0d111c" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="2" fill="#10b981"/>

  <!-- Bottom Right -->
  <circle cx="72" cy="74" r="6" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="72" cy="74" r="2.5" fill="#ffffff"/>

  <!-- Mid Right -->
  <circle cx="72" cy="50" r="3.5" fill="#38bdf8"/>

  <!-- Top Right -->
  <circle cx="72" cy="26" r="5.5" fill="#0d111c" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="72" cy="26" r="2.5" fill="#38bdf8"/>
</svg>
